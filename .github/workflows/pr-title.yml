name: PR title

# Pull requests are squash-merged and their title becomes the commit on main,
# which is what the release version is derived from. So the title must be a
# Conventional Commit.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check that the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title must be a Conventional Commit, e.g. 'feat: add tag manager' or 'fix(mcp): reject empty ids'."
            echo "Got: $TITLE"
            echo "Types: feat (minor release), fix/perf/revert (patch release), refactor, docs, test, build, ci, chore (no release)."
            echo "Append ! after the type for a breaking change, e.g. 'feat!: drop the v1 API'."
            exit 1
          fi
